# Same topology as dumbbell_aimd.yaml, but both flows use the simplified CUBIC controller.
seed: 42
duration: 30
nodes: [s1, s2, r1, r2, d1, d2]
links:
  - {a: s1, b: r1, bandwidth_mbps: 100, delay_ms: 2}
  - {a: s2, b: r1, bandwidth_mbps: 100, delay_ms: 2}
  - a: r1
    b: r2
    bandwidth_mbps: 10
    delay_ms: 20
    queue: {type: droptail, capacity: 50}
  - {a: r2, b: d1, bandwidth_mbps: 100, delay_ms: 2}
  - {a: r2, b: d2, bandwidth_mbps: 100, delay_ms: 2}
flows:
  - {id: f1, src: s1, dst: d1, kind: tcp, cc: cubic, start: 0.0}
  - {id: f2, src: s2, dst: d2, kind: tcp, cc: cubic, start: 1.0}
